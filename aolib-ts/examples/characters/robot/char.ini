; Block-encoded character (preferred format). `model` marks it 3D.
[options]
name = Robot
showname = Robot
side = wit
model = robot.pmx

[emotions]
number = 2
1 = idle
2 = objection

[emote idle]
anim = idle_loop.vmd

[emote objection]
anim      = objection.vmd
preanim   = point.vmd
postanim  = lower_arm.vmd
sound     = objection.opus
sounddelayms = 480
modifier  = zoom
deskmod   = shown
