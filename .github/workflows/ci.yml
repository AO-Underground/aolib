name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spec:
    name: spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate schemas
        working-directory: spec
        run: ./validate.sh
      - name: Check schema formatting
        working-directory: spec
        run: |
          ./format.sh >/dev/null
          git diff --exit-code || { echo "::error::spec JSON is not formatted; run spec/format.sh"; exit 1; }
      - name: Go module major matches ts/package.json
        run: ./release.sh --check

  go:
    name: aolib-go
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: test
        run: go test ./...
      - name: codegen matches spec
        run: |
          rm -f ./*_gen.go
          go run ./cmd/aolib-gen -meta ../spec -out .
          gofmt -w ./*_gen.go
          [ -z "$(git status --porcelain .)" ] || { git status --short .; echo "::error::generated Go is out of date; run cmd/aolib-gen against ../spec"; exit 1; }

  ts:
    name: aolib-ts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: install
        run: bun install --frozen-lockfile
      - name: typecheck
        run: bun run typecheck
      - name: lint
        run: bun run lint
      - name: test
        run: bun test
      - name: codegen matches spec
        run: |
          bun run codegen
          git diff --exit-code || { echo "::error::generated TS is out of date; run bun codegen against ../spec"; exit 1; }
      - name: packed tarball imports
        run: ./scripts/pack-smoke.sh

  cpp:
    name: aolib-cpp
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cpp
    steps:
      - uses: actions/checkout@v4
      - name: configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: build
        run: cmake --build build
      - name: test
        run: ctest --test-dir build --output-on-failure
      - name: codegen matches spec
        run: |
          cmake --build build --target aolib-gen
          ./build/aolib-gen -meta ../spec -out .
          git diff --exit-code || { echo "::error::generated C++ is out of date; run aolib-gen against ../spec"; exit 1; }

  python:
    name: aolib-python
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: pip install -e ".[test]"
      - name: test
        run: pytest
      - name: codegen matches spec
        run: |
          python scripts/codegen.py
          git diff --exit-code || { echo "::error::generated Python is out of date; run scripts/codegen.py against ../spec"; exit 1; }
